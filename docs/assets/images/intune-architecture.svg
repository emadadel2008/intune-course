<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0078D4"/>
      <stop offset="100%" style="stop-color:#005A9E"/>
    </linearGradient>
    <linearGradient id="intuneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0078D4"/>
      <stop offset="100%" style="stop-color:#005A9E"/>
    </linearGradient>
    <linearGradient id="aadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#225086"/>
      <stop offset="100%" style="stop-color:#1A3A6B"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000025"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" fill="#F3F6FB" rx="12"/>

  <!-- Header -->
  <rect width="900" height="52" fill="url(#headerGrad)" rx="12"/>
  <rect width="900" height="40" y="12" fill="url(#headerGrad)"/>
  <text x="450" y="32" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="white" text-anchor="middle">Microsoft Intune — Ecosystem Architecture</text>

  <!-- ─── CENTRE: Microsoft Intune box ─── -->
  <rect x="330" y="195" width="240" height="100" rx="14" fill="url(#intuneGrad)" filter="url(#shadow)"/>
  <text x="450" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="white" text-anchor="middle">Microsoft Intune</text>
  <text x="450" y="256" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#BDD9F2" text-anchor="middle">MDM · MAM · Endpoint Manager</text>
  <text x="450" y="275" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#BDD9F2" text-anchor="middle">Policy · Compliance · Apps</text>

  <!-- ─── TOP: Azure AD / Entra ID ─── -->
  <rect x="330" y="80" width="240" height="80" rx="12" fill="url(#aadGrad)" filter="url(#shadow)"/>
  <text x="450" y="117" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="white" text-anchor="middle">Microsoft Entra ID</text>
  <text x="450" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#BDD9F2" text-anchor="middle">Identity · Conditional Access · MFA</text>

  <!-- Arrow Entra → Intune -->
  <line x1="450" y1="160" x2="450" y2="192" stroke="#0078D4" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="450,195 444,185 456,185" fill="#0078D4"/>
  <text x="460" y="178" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Identity Sync</text>

  <!-- ─── LEFT COLUMN: Devices ─── -->
  <!-- Windows -->
  <rect x="60" y="100" width="170" height="60" rx="10" fill="#1E4D8C" filter="url(#shadow)"/>
  <text x="145" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🖥 Windows 10/11</text>
  <text x="145" y="148" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Autopilot · BitLocker · WSUS</text>

  <!-- macOS -->
  <rect x="60" y="180" width="170" height="60" rx="10" fill="#374B73" filter="url(#shadow)"/>
  <text x="145" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🍎 macOS</text>
  <text x="145" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Config Profiles · FileVault</text>

  <!-- iOS/iPadOS -->
  <rect x="60" y="260" width="170" height="60" rx="10" fill="#374B73" filter="url(#shadow)"/>
  <text x="145" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">📱 iOS / iPadOS</text>
  <text x="145" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">DEP · Supervised Mode</text>

  <!-- Android -->
  <rect x="60" y="340" width="170" height="60" rx="10" fill="#374B73" filter="url(#shadow)"/>
  <text x="145" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🤖 Android</text>
  <text x="145" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Work Profile · COPE · COBO</text>

  <!-- Arrows: Devices → Intune -->
  <line x1="230" y1="130" x2="328" y2="230" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="230" y1="210" x2="328" y2="240" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="230" y1="290" x2="328" y2="250" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="230" y1="370" x2="328" y2="260" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="245" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">MDM Enroll</text>

  <!-- ─── RIGHT COLUMN: Integrations ─── -->
  <!-- Defender -->
  <rect x="670" y="100" width="180" height="60" rx="10" fill="#A4373A" filter="url(#shadow)"/>
  <text x="760" y="127" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🛡 Defender for Endpoint</text>
  <text x="760" y="146" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#FFC0C0" text-anchor="middle">Threat · Risk · Compliance</text>

  <!-- Autopilot -->
  <rect x="670" y="180" width="180" height="60" rx="10" fill="#006B4F" filter="url(#shadow)"/>
  <text x="760" y="207" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🚀 Windows Autopilot</text>
  <text x="760" y="226" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#A8F0D0" text-anchor="middle">Zero-Touch Provisioning</text>

  <!-- Purview -->
  <rect x="670" y="260" width="180" height="60" rx="10" fill="#6B3A7D" filter="url(#shadow)"/>
  <text x="760" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">📂 Microsoft Purview</text>
  <text x="760" y="306" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#DDB8EA" text-anchor="middle">DLP · Sensitivity Labels</text>

  <!-- Graph API -->
  <rect x="670" y="340" width="180" height="60" rx="10" fill="#004E8C" filter="url(#shadow)"/>
  <text x="760" y="367" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">⚡ Graph API / PowerShell</text>
  <text x="760" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Automation · Reporting</text>

  <!-- Arrows: Intune → Integrations -->
  <line x1="570" y1="228" x2="668" y2="130" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="238" x2="668" y2="210" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="248" x2="668" y2="290" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="570" y1="258" x2="668" y2="370" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="595" y="235" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#555">Integrate</text>

  <!-- ─── BOTTOM: Admin &amp; Reporting ─── -->
  <rect x="220" y="370" width="200" height="60" rx="10" fill="#004E8C" filter="url(#shadow)"/>
  <text x="320" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">📊 Endpoint Analytics</text>
  <text x="320" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Reports · Log Analytics · KQL</text>

  <rect x="480" y="370" width="200" height="60" rx="10" fill="#004E8C" filter="url(#shadow)"/>
  <text x="580" y="397" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">🏥 Remote Help</text>
  <text x="580" y="416" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#BDD9F2" text-anchor="middle">Support · RBAC · Sessions</text>

  <!-- Arrows: Intune → Bottom boxes -->
  <line x1="400" y1="295" x2="340" y2="368" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="500" y1="295" x2="560" y2="368" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Legend -->
  <rect x="30" y="460" width="840" height="44" rx="8" fill="white" fill-opacity="0.7"/>
  <line x1="60" y1="482" x2="90" y2="482" stroke="#50E6FF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="96" y="486" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Enrollment / Integration</text>
  <rect x="250" y="472" width="14" height="14" rx="3" fill="#1E4D8C"/>
  <text x="270" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Managed Devices</text>
  <rect x="400" y="472" width="14" height="14" rx="3" fill="url(#intuneGrad)"/>
  <text x="420" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Core Platform</text>
  <rect x="535" y="472" width="14" height="14" rx="3" fill="#A4373A"/>
  <text x="555" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Security Services</text>
  <rect x="680" y="472" width="14" height="14" rx="3" fill="#006B4F"/>
  <text x="700" y="484" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#444">Microsoft 365 Integration</text>
</svg>
