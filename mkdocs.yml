site_name: Microsoft Intune Training Course
site_description: Complete hands-on lab guide for Microsoft Intune — MD-102 & MS-101 certification prep
site_url: https://emadadel2008.github.io/intune-course/
site_author: emadadel2008
repo_url: https://github.com/emadadel2008/intune-course
repo_name: emadadel2008/intune-course
edit_uri: edit/main/docs/

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - toc.integrate
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
    - header.autohide
  icon:
    repo: fontawesome/brands/github
    logo: material/microsoft-azure

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/emadadel2008/intune-course
      name: GitHub Repository
  analytics:
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback!

extra_css:
  - assets/stylesheets/extra.css

plugins:
  - search:
      lang: en
  - minify:
      minify_html: true

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      title: On this page
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - Home: index.md
  - Modules:
    - Module 1 — Introduction: modules/01-introduction/index.md
    - Module 2 — Intune Fundamentals: modules/02-intune-fundamentals/index.md
    - Module 3 — Getting Started: modules/03-getting-started/index.md
    - Module 4 — Device Enrollment & Management: modules/04-enrollment-management/index.md
    - Module 5 — Application Management: modules/05-application-management/index.md
    - Module 6 — Security & Compliance: modules/06-security-compliance/index.md
    - Module 7 — Remote Help & Support:
      - Overview: modules/07-remote-help-support/index.md
      - Lab Guide: modules/07-remote-help-support/lab-guide.md
    - Module 8 — Reporting & Analytics: modules/08-reporting-analytics/index.md
    - Module 9 — Integrations & Automation: modules/09-integrations-automation/index.md
    - Module 10 — Best Practices: modules/10-best-practices/index.md
    - Module 11 — Capstone Project:
      - Overview: modules/11-capstone/index.md
      - Lab Guide: modules/11-capstone/lab-guide.md
